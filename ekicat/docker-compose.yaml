services:
  postgres:
    image: postgis/postgis:17-3.5
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/app/scripts:r
    environment:
      - POSTGRES_USER=ekicatdev
      - POSTGRES_PASSWORD=ekicatdev
      - POSTGRES_DB=ekicatdev
    restart: unless-stopped

  nextjs:
    image: node:24-bookworm
    working_dir: /app
    ports:
      - 3000:3000
    volumes:
      - .:/app
    command: npm run dev
    restart: unless-stopped
volumes:
  pgdata: {}
