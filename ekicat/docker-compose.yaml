services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: always
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./operations:/app/operations:r
    environment:
      - POSTGRES_USER=ekicatdev
      - POSTGRES_PASSWORD=ekicatdev
      - POSTGRES_DB=ekicatdev
volumes:
  pgdata: {}
